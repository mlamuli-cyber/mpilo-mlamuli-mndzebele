<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  })();
</script>
<title>Notice · Help Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f5fdd'/%3E%3Cpath d='M12 4 5 7.5V12c0 4.2 3 7.6 7 8 4-.4 7-3.8 7-8V7.5L12 4Z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='m9 12.2 1.8 1.8L15 10' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/demo.css" />
<script src="js/demo-data.js" defer></script>
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <span class="brand-mark brand-mark-lg brand-mark-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.7 3.86a2 2 0 0 0-3.4 0Z"/></svg>
      </span>
      <h1>Oops</h1>
      <p class="auth-sub" id="error-message">Something needs your attention.</p>
      <a href="index.html" class="btn btn-primary btn-block" id="home-link">Go back home</a>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var message = new URLSearchParams(window.location.search).get('message');
      if (message) document.getElementById('error-message').textContent = message;
      var user = window.HD.getSession();
      if (user) document.getElementById('home-link').setAttribute('href', window.HD.homeFor(user));
    });
  </script>
</body>
</html>
