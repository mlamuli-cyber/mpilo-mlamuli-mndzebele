<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found | Mndzebele Mpilo Mlamuli</title>
<meta name="robots" content="noindex" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B1320'/%3E%3Ccircle cx='50' cy='24' r='9' fill='%234FD8C4'/%3E%3Ccircle cx='24' cy='74' r='9' fill='%23FFB454'/%3E%3Ccircle cx='76' cy='74' r='9' fill='%23FFB454'/%3E%3Cpath d='M50 24L24 74M50 24L76 74' stroke='%23314261' stroke-width='5'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />

<style>
  .notfound{
    min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 40px 24px;
  }
  .notfound-terminal{
    font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 28px 30px; max-width: 480px; width: 100%; text-align: left;
    margin-bottom: 32px;
  }
  .notfound-terminal .bar{ display:flex; gap:6px; margin-bottom: 16px; }
  .notfound-terminal .dot{ width:10px; height:10px; border-radius:50%; }
  .dot-red{ background:#FF5F57; } .dot-yellow{ background:#FEBC2E; } .dot-green{ background:#28C840; }
  .notfound-terminal p{ font-size: 13.5px; margin: 6px 0; color: var(--text-muted); }
  .notfound-terminal .prompt{ color: var(--accent); margin-right: 6px; }
  .notfound-terminal .err{ color: var(--accent-2); }
  .notfound h1{ font-size: clamp(48px, 10vw, 96px); font-family: var(--font-display); color: var(--text); margin-bottom: 6px; }
  .notfound p.lead{ color: var(--text-muted); font-size: 16px; margin-bottom: 28px; max-width: 420px; }
</style>
</head>
<body>

<div class="notfound">
  <div class="notfound-terminal">
    <div class="bar"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></div>
    <p><span class="prompt">$</span> curl this-page</p>
    <p class="err">Error: 404 Not Found — route does not exist</p>
    <p><span class="prompt">$</span> suggest --fix</p>
    <p>Try heading back home instead.</p>
  </div>

  <h1>404</h1>
  <p class="lead">This page doesn't exist, or it moved. Let's get you back on track.</p>
  <a href="/mpilo-mlamuli-mndzebele/" class="btn btn-primary">Back to Home</a>
</div>

</body>
</html>
